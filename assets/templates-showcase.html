<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>visualize templates showcase</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: oklch(0.93 0.005 85); }
  .grid {
    width: 1280px;
    display: grid;
    grid-template-columns: repeat(4, 320px);
    grid-template-rows: repeat(4, 200px);
    gap: 0;
  }
  .tile {
    width: 320px;
    height: 200px;
    overflow: hidden;
    position: relative;
    background: #fff;
    border: 1px solid oklch(0.88 0.006 85);
  }
  .tile iframe {
    width: 1100px;
    height: 687px;
    border: 0;
    transform: scale(0.291);
    transform-origin: top left;
    pointer-events: none;
    display: block;
  }
</style>
</head>
<body>
<div class="grid">
  <div class="tile"><iframe title="one-pager · swiss · light" src="../temp/template-previews/one-pager/swiss/light.html"></iframe></div>
  <div class="tile"><iframe title="release-announcement · kinetic-orange · light" src="../temp/template-previews/release-announcement/kinetic-orange/light.html"></iframe></div>
  <div class="tile"><iframe title="comparison · brutalist · light" src="../temp/template-previews/comparison/brutalist/light.html"></iframe></div>
  <div class="tile"><iframe title="slide-deck · deck · dark" src="../temp/template-previews/slide-deck/deck/dark.html"></iframe></div>
  <div class="tile"><iframe title="dashboard · console · dark" src="../temp/template-previews/dashboard/console/dark.html"></iframe></div>
  <div class="tile"><iframe title="data-explorer · blueprint · light" src="../temp/template-previews/data-explorer/blueprint/light.html"></iframe></div>
  <div class="tile"><iframe title="status-page · terminal · dark" src="../temp/template-previews/status-page/terminal/dark.html"></iframe></div>
  <div class="tile"><iframe title="api-reference · console · dark" src="../temp/template-previews/api-reference/console/dark.html"></iframe></div>
  <div class="tile"><iframe title="architecture-overview · blueprint · light" src="../temp/template-previews/architecture-overview/blueprint/light.html"></iframe></div>
  <div class="tile"><iframe title="diff-review · terminal · dark" src="../temp/template-previews/diff-review/terminal/dark.html"></iframe></div>
  <div class="tile"><iframe title="tutorial · blueprint · light" src="../temp/template-previews/tutorial/blueprint/light.html"></iframe></div>
  <div class="tile"><iframe title="proposal · kinetic-orange · light" src="../temp/template-previews/proposal/kinetic-orange/light.html"></iframe></div>
  <div class="tile"><iframe title="report · editorial · light" src="../temp/template-previews/report/editorial/light.html"></iframe></div>
  <div class="tile"><iframe title="whitepaper · paper-ink · light" src="../temp/template-previews/whitepaper/paper-ink/light.html"></iframe></div>
  <div class="tile"><iframe title="survey-results · hyper-saturated · light" src="../temp/template-previews/survey-results/hyper-saturated/light.html"></iframe></div>
  <div class="tile"><iframe title="rfc · brutalist · light" src="../temp/template-previews/rfc/brutalist/light.html"></iframe></div>
</div>
</body>
</html>
