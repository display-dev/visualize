<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>visualize cover</title>
<style>
  :root {
    --bg:           oklch(0.97 0.006 85);
    --fg:           oklch(0.18 0.006 85);
    --muted:        oklch(0.46 0.006 85);
    --hairline:     oklch(0.85 0.006 85);
    --primary:      oklch(0.48 0.18 145);
    --font-sans:    -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --font-mono:    ui-monospace, 'SF Mono', 'JetBrains Mono', 'IBM Plex Mono', Menlo, Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
  }
  .banner {
    width: 1280px;
    height: 320px;
    padding: 56px 80px;
    display: grid;
    grid-template-rows: 1fr auto;
    gap: 32px;
    position: relative;
  }

  .top {
    display: flex;
    align-items: flex-end;
    gap: 32px;
  }

  .wordmark {
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 108px;
    letter-spacing: -0.04em;
    line-height: 0.95;
    color: var(--fg);
    margin: 0;
  }
  .wordmark .caret {
    color: var(--primary);
    font-weight: 500;
    margin-left: 2px;
    display: inline-block;
    transform: translateY(-6px);
  }

  .tag {
    font-family: var(--font-mono);
    font-size: 17px;
    color: var(--muted);
    letter-spacing: -0.005em;
    line-height: 1.4;
    padding-bottom: 18px;
    max-width: 40ch;
    text-wrap: balance;
  }
  .tag em {
    font-style: normal;
    color: var(--fg);
    font-weight: 500;
  }

  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--hairline);
    padding-top: 24px;
  }

  .surface {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.01em;
  }
  .surface .num {
    color: var(--fg);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .surface .sep {
    width: 4px;
    height: 4px;
    background: var(--hairline);
    border-radius: 50%;
  }

  .install {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--muted);
    background: oklch(1 0 0);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 8px 14px;
  }
  .install .prompt {
    color: var(--primary);
    font-weight: 700;
  }
  .install .cmd {
    color: var(--fg);
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="banner">

    <div class="top">
      <h1 class="wordmark">visualize<span class="caret">|</span></h1>
      <p class="tag">
        generate <em>beautiful, on-brand HTML artifacts</em> with your AI assistant
      </p>
    </div>

    <div class="bottom">
      <div class="surface">
        <span>templates</span>
        <span class="sep"></span>
        <span>design systems</span>
        <span class="sep"></span>
        <span>iteration verbs</span>
        <span class="sep"></span>
        <span>brand profile</span>
      </div>
      <div class="install">
        <span class="prompt">$</span>
        <span class="cmd">npx skills add display-dev/visualize</span>
      </div>
    </div>

  </div>
</body>
</html>
