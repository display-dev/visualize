<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>visualize showcase</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: oklch(0.93 0.005 85); }

  .grid {
    width: 1280px;
    display: grid;
    grid-template-columns: repeat(4, 320px);
    grid-template-rows: repeat(4, 200px);
    gap: 0;
  }

  .tile {
    width: 320px;
    height: 200px;
    overflow: hidden;
    position: relative;
    background: #fff;
    border: 1px solid oklch(0.88 0.006 85);
  }
  .tile iframe {
    width: 1100px;
    height: 687px;
    border: 0;
    transform: scale(0.291);
    transform-origin: top left;
    pointer-events: none;
    display: block;
  }
</style>
</head>
<body>
<div class="grid">

  <!-- Row 1: loud native systems -->
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/neon/preview-dark.html"></iframe></div>
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/neon-velocity/preview-dark.html"></iframe></div>
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/hyper-saturated/preview-dark.html"></iframe></div>
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/kinetic-orange/preview-dark.html"></iframe></div>

  <!-- Row 2: texture and illustration -->
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/grunge-collage/preview.html"></iframe></div>
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/clean/preview.html"></iframe></div>
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/sketch/preview.html"></iframe></div>
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/riso/preview.html"></iframe></div>

  <!-- Row 3: type and layout -->
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/brutalist/preview.html"></iframe></div>
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/bold-editorial/preview.html"></iframe></div>
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/deep-red/preview-dark.html"></iframe></div>
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/tech-editorial/preview.html"></iframe></div>

  <!-- Row 4: monochrome and technical surfaces -->
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/swiss/preview.html"></iframe></div>
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/monochrome/preview.html"></iframe></div>
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/architectural-type/preview.html"></iframe></div>
  <div class="tile"><iframe src="/Users/carl/Development/visualize/visualize/design-systems/win98/preview.html"></iframe></div>

</div>
</body>
</html>
