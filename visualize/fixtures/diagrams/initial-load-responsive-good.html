<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initial-load responsive edge</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><meta property="og:title" content="Initial-load responsive edge"><style>svg{display:block;width:100%;height:auto}.edge{fill:none;stroke:#111;stroke-width:2}</style></head><body><figure data-visualize-diagram="flow"><svg role="img" aria-labelledby="ilr-title" viewBox="0 0 240 100"><title id="ilr-title">Initial-load responsive edge</title><desc>A connector chooses its curve from the viewport width at initial load.</desc><path id="initial-edge" class="edge" data-diagram-edge="initial" data-from="one" data-to="two" d="M 90 50 H 150"/><g data-diagram-node="one"><rect x="10" y="25" width="80" height="50"/></g><g data-diagram-node="two"><rect x="150" y="25" width="80" height="50"/></g></svg></figure><script>const edge=document.getElementById('initial-edge');edge.setAttribute('d',innerWidth<=500?'M 90 50 C 110 35 130 65 150 50':innerWidth>=1000?'M 90 50 H 150':'M 0 0')</script></body></html>
