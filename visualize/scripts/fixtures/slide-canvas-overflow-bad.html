<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>slide-canvas-overflow bad fixture</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; }
    slide-canvas { display: block; width: 100%; height: 100%; }
    .slide-canvas-canvas { position: relative; width: 1920px; height: 1080px; }
    section { position: absolute; inset: 0; width: 1920px; height: 1080px; box-sizing: border-box; font-family: system-ui, sans-serif; }
    section[inert] { visibility: hidden; }
    .overflow { position: absolute; left: 1840px; top: 120px; width: 260px; font-size: 24px; line-height: 1.2; }
    .overlap-a, .overlap-b { position: absolute; left: 240px; top: 360px; font-size: 42px; line-height: 1; }
    .overlap-b { left: 250px; top: 368px; }
    .tiny { position: absolute; left: 240px; top: 520px; font-size: 8px; line-height: 1.2; }
  </style>
  <script>
    customElements.define('slide-canvas', class extends HTMLElement {
      connectedCallback() {
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => this.connectedCallback(), { once: true });
          return;
        }
        if (this.querySelector(':scope > .slide-canvas-canvas')) return;
        const canvas = document.createElement('div');
        canvas.className = 'slide-canvas-canvas';
        while (this.firstChild) canvas.appendChild(this.firstChild);
        this.appendChild(canvas);
      }
    });
  </script>
</head>
<body>
  <slide-canvas noscale>
    <section data-visualize-validate="no-overflowing-text no-overflowing-content no-overlapping-text slide-sized-text">
      <p class="overflow">This line leaves the slide.</p>
      <p class="overlap-a">Overlap text</p>
      <p class="overlap-b">Overlap text</p>
      <p class="tiny">Tiny text below the slide floor.</p>
    </section>
  </slide-canvas>
</body>
</html>
